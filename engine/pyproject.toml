[project]
name = "foxgrid-engine"
version = "0.3.0"
description = "Bearing fusion engine for FoxGrid (no web or DB dependencies)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "pyproj>=3.6"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foxgrid_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
strict = true
plugins = ["numpy.typing.mypy_plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=foxgrid_engine --cov-report=term-missing --cov-fail-under=90"
