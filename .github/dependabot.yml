version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: uv
    directory: /engine
    schedule: { interval: weekly }
  - package-ecosystem: pub
    directory: /app
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: bundler
    directory: /
    schedule: { interval: monthly }
