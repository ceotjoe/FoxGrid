name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token; nothing in CI needs more.
permissions:
  contents: read

# A newer push to the same branch or PR supersedes the running one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: engine } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy --strict foxgrid_engine
      - run: uv run pytest

  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy app
      # Integration tests start PostGIS, Redis and Mosquitto via testcontainers (Docker is available).
      - run: uv run pytest

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv run --python 3.12 --with pytest --with aiomqtt pytest tools/relay_hook
      - run: uv run --python 3.12 --with pytest --with aiomqtt --with pyproj pytest tools/sensor_client

  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
