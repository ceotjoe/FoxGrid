name: Deploy web app

# Publishes the Flutter web build (PWA) to GitHub Pages.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy; the next one waits.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Build web
        working-directory: app
        # Project pages live under /<repo>/, so the base href must match the repository name.
        run: |
          flutter pub get
          flutter build web --release --base-href "/${GITHUB_REPOSITORY#*/}/"
      - uses: actions/upload-pages-artifact@v5
        with: { path: app/build/web }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
