# FoxGrid MQTT broker. Credentials come from the environment (see docker-compose.yml);
# the password file is generated at start-up. Sensors additionally authenticate each message
# with their own API key, so the broker login only decides who may talk to the broker at all.
listener 1883
allow_anonymous false
password_file /tmp/passwd
persistence true
persistence_location /mosquitto/data/
max_packet_size 65536
